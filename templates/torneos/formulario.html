{% extends "base.html" %}
{% block title %}Editar {{ torneo.nombre }} · TorneoX{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl">
  <a href="{% url 'torneos:lista' %}" class="text-sm font-semibold text-emerald-800 hover:text-emerald-950">&larr; Volver a torneos</a>
  <div class="mb-6 mt-5">
    <p class="text-sm font-semibold uppercase tracking-wider text-emerald-800">Reglas del campeonato</p>
    <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-950">Editar torneo</h1>
    <p class="mt-2 text-sm text-slate-600">{{ torneo.nombre }}</p>
  </div>

  <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-7">
    <form method="post" class="space-y-5">
      {% csrf_token %}
      {% include "torneos/_form_fields.html" %}
      <div class="flex flex-col-reverse gap-3 border-t border-slate-100 pt-5 sm:flex-row sm:justify-end">
        <a href="{% url 'torneos:lista' %}" class="rounded-lg border border-slate-300 px-4 py-2.5 text-center text-sm font-semibold text-slate-700 hover:bg-slate-50">Cancelar</a>
        <button type="submit" class="rounded-lg bg-emerald-800 px-5 py-2.5 text-sm font-semibold text-white hover:bg-emerald-900 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:ring-offset-2">Guardar cambios</button>
      </div>
    </form>
  </section>
</div>
{% endblock %}
